sample_size: 25
random_seed: 42

required_languages:
  - sv

min_description_words: 3

placeholder_descriptions:
  - n/a
  - na
  - tbd
  - todo
  - description

required_image_ratios: []
undefined_image_types:
  - ""
  - undefined
  - staple
  - unknown
  - null

id_keys:
  - data.product_external_reference
  - related.product.references.external_reference
  - related.product.references.product_code

# TV4's numeric product reference is the canonical content ID for this provider.
# Skip the generic contentId/originalContentId/guid fallback so every finding
# shows the same numeric format instead of mixing in alphanumeric IDs.
disable_id_fallback: true

# Keep checks focused on mapping quality while adapter is not live.
disabled_converted_checks:
  - conv_event_expired
  - conv_event_not_yet_valid
  - conv_schedule_required_field_missing
  - conv_schedule_original_channel_id_invalid
  - conv_schedule_adapter_id_invalid
  - conv_envelope_required_field_missing
  - conv_content_id_missing
  - conv_broadcast_required_field_missing
  - conv_event_required_field_missing
  - conv_duplicate_broadcast_id
  - conv_broadcast_content_reference_invalid
  - conv_epg_from_to_dates_invalid
  - conv_epg_to_date_format_invalid
  - conv_broadcast_gap_between
  - conv_broadcast_overlap_start
  - conv_broadcast_overlap_end
  - conv_broadcast_rerun_live_premiere_conflict
  - conv_schedule_duration_exceeds_24h
  - conv_image_ratio_mapping
  - conv_image_type_mapping
  - conv_image_url_invalid
  - conv_image_dimensions_invalid
  - conv_language_mapping

# Keep checks focused on requested original quality checks.
disabled_original_checks:
  - orig_event_future
  - orig_empty_metadata
  - orig_schedule_required_field_missing
  - orig_schedule_original_channel_id_invalid
  - orig_schedule_adapter_id_invalid
  - orig_envelope_required_field_missing
  - orig_content_id_missing
  - orig_broadcast_required_field_missing
  - orig_event_required_field_missing
  - orig_duplicate_broadcast_id
  - orig_broadcast_content_reference_invalid
  - orig_epg_from_to_dates_invalid
  - orig_epg_to_date_format_invalid
  - orig_broadcast_gap_between
  - orig_broadcast_overlap_start
  - orig_broadcast_overlap_end
  - orig_broadcast_rerun_live_premiere_conflict
  - orig_schedule_duration_exceeds_24h
  - orig_missing_image_ratio
  - orig_images_missing
  - orig_image_type_invalid
  - orig_image_scope_invalid
  - orig_image_value_missing
  - orig_image_url_invalid
  - orig_image_dimensions_invalid
  - orig_title_language_missing_fi

type_keys:
  - related.product.type
  - data.type
  - content.@type
  - content.type
  - '@type'

provider_group_keys:
  - group
  - package
  - providerGroup

kids_flags_keys:
  - isKids
  - kids
  - audience
  - targetAudience
  - category

candidate_keys:
  title:
    - data.name
    - related.product.press_sheets.translated_title
    - title
    - name
  description:
    - related.product.press_sheets.long_description
    - related.product.press_sheets.medium_description
    - related.product.press_sheets.brief_description
    - description
  descriptions_block:
    - descriptions
    - related.product.press_sheets
  images:
    - related.product.assets
    - images
  image_type:
    - type
    - related.product.assets.type
  image_ratio:
    - ratio
  genre:
    - related.product.genres
    - related.product.genres.genre_name
    - content.genres.main
    - content.originalGenres
  production_year:
    - related.product.production_year
    - content.productionYear
  duration:
    - related.product.duration
    - data.media_asset.duration
    - vods.durationInSeconds
  age_rating:
    - related.product.age_ratings.rating
    - content.ageRating
  deeplink:
    - data.deeplinks.tv4play.episode
    - data.deeplinks.tv4play.series
    - data.deeplinks.mtvkatsomo.episode
    - data.deeplinks.mtvkatsomo.series
  source_type:
    - data.type
    - sourceType
  vod_id:
    - data.asset_id
    - vodId
    - originalVodId
  publishing_info:
    - publishingInfo
    - data.rights
  country_code:
    - related.product.production_country
    - productionCountries
  language_code:
    - related.product.press_sheets.language
    - titles.language
  series_id:
    - related.product.series.references.external_reference
    - content.season.originalSeasonId
