sample_size: 25
random_seed: 42
required_languages:
  - en
min_description_words: 3
placeholder_descriptions:
  - n/a
  - na
  - tbd
  - todo
  - description
required_image_ratios:
  - "16:9"
  - "2:3"
undefined_image_types:
  - ""
  - undefined
  - staple
  - unknown
  - null
episode_count_thresholds:
  min: 1
  max: 500

# Must-pass structural contract checks (provider-overridable)
required_envelope_fields:
  epg:
    - version
    - timestamp
    - contents
  vod:
    - version
    - timestamp
  event:
    - version
    - timestamp
    - content
    - events
    - publishingInfo

required_broadcast_fields:
  - broadcastId
  - originalBroadcastId
  - contentId
  - displayTime.start
  - displayTime.end

required_event_fields:
  - start
  - eventId
  - originalEventId
  - contentId
  - sourceType
  - references

# Regex used for VOD id structural validation.
vod_id_pattern: '^[A-Za-z0-9._:-]+$'

# Configure these keys to match your real metadata schema.
id_keys:
  - contentId
  - mediaId
  - seasonId
  - seriesId

type_keys:
  - type
  - contentType
  - content_type
  - level
  - entityType

provider_group_keys:
  - group
  - package
  - providerGroup
  - provider_group

kids_flags_keys:
  - isKids
  - kids
  - audience
  - targetAudience
  - category

candidate_keys:
  title:
    - title
    - name
    - titles.main
    - localized.title
  description:
    - description
    - synopsis
    - plot
    - descriptions.main
  descriptions_block:
    - descriptions
    - localized.descriptions
    - i18n.descriptions
  images:
    - images
    - imageAssets
    - artworks
  genre:
    - genres
    - genre
    - categories
  production_year:
    - productionYear
    - year
    - releaseYear
  duration:
    - duration
    - durationSeconds
    - runtime
    - runtimeSeconds
  age_rating:
    - ageRating
    - rating
    - parentalRating
  deeplink:
    - deeplink
    - deepLink
    - links.app
    - links.web
  source_type:
    - sourceType
    - source_type
    - content.sourceType
  vod_id:
    - vodId
    - vod_id
    - contentId
    - id
  publishing_info:
    - publishingInfo
    - publishing
    - rights
    - broadcastRights
  targets:
    - targets
    - publishingInfo.targets
  rights:
    - rights
    - broadcastRights
    - publishingInfo.targets.rights
  country_code:
    - metadataOriginCountry
    - country
    - countryCode
  language_code:
    - lang
    - language
    - locale
    - languageCode
  contents:
    - contents
    - content
  broadcasts:
    - broadcasts
    - schedules.broadcasts
  events:
    - events
  broadcast_id:
    - broadcastId
    - id
  original_broadcast_id:
    - originalBroadcastId
  broadcast_content_id:
    - contentId
  display_start:
    - displayTime.start
    - start
    - from
  display_end:
    - displayTime.end
    - end
    - to
  channel_id:
    - channelId
    - originalChannelId
  schedule_from:
    - from
    - start
  schedule_to:
    - to
    - end
  schedule_date:
    - date
  rerun:
    - rerun
    - isRerun
  live:
    - live
    - isLive
  premiere:
    - premiere
    - isPremiere
  event_start:
    - start
    - startDate
  event_id:
    - eventId
    - id
  event_original_id:
    - originalEventId
  event_content_id:
    - contentId
  event_source_type:
    - sourceType
  event_references:
    - references
  series_id:
    - seriesId
    - series_id
    - parentSeriesId
    - showId
